[package]
name = "audioglass-dsp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
rustfft = "6.4.1"
realfft = "3.5"

[dev-dependencies]
ebur128 = "0.1"

[profile.release]
panic = "abort"

[lints.rust]
dead_code = "allow"
unused_macros = "allow"
unused_imports = "allow"
